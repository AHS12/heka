name: Release Installers

# Automatic: creating/publishing a GitHub Release builds its tag and attaches
# the installers. Manual: run this workflow with a release tag to rebuild and
# replace that release's assets.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild (e.g. v0.9.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Resolve tag and version
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
          else
            TAG="$INPUT_TAG"
          fi
          if [ -z "$TAG" ]; then
            echo "No release tag provided" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$TAG' is not a vX.Y.Z release tag" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION"

      - name: Ensure the release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.tag }}

      - name: Verify version sources match the tag
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          v="$VERSION"
          mismatch=0
          jq -e --arg v "$v" '.info.productVersion == $v' wails.json >/dev/null \
            || { echo "::error file=wails.json::productVersion != $v"; mismatch=1; }
          grep -q "var appVersion = \"$v\"" main.go \
            || { echo "::error file=main.go::appVersion != $v"; mismatch=1; }
          grep -q "export const APP_VERSION = '$v'" frontend/src/lib/version.ts \
            || { echo "::error file=frontend/src/lib/version.ts::APP_VERSION != $v"; mismatch=1; }
          grep -Eq "^VERSION[[:space:]]*\?=[[:space:]]*$v$" Makefile \
            || { echo "::error file=Makefile::VERSION != $v"; mismatch=1; }
          jq -e --arg v "$v" '.version == $v' frontend/package.json >/dev/null \
            || { echo "::error file=frontend/package.json::version != $v"; mismatch=1; }
          if [ "$mismatch" -ne 0 ]; then
            echo "Tag $v does not match the repo's version sources." >&2
            exit 1
          fi

  windows:
    needs: resolve
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build GUI and console binaries
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          wails build -clean -o heka-gui.exe -ldflags "-X main.appVersion=$env:VERSION"
          wails build -windowsconsole -o heka.exe -ldflags "-X main.appVersion=$env:VERSION"

      - name: Build NSIS installer
        shell: pwsh
        working-directory: build/windows/installer
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = "makensis" }
          & $makensis -DINFO_PRODUCTVERSION="$env:VERSION" `
            -DARG_WAILS_AMD64_BINARY=..\..\bin\heka-gui.exe `
            -DARG_HEKA_AMD64_BINARY=..\..\bin\heka.exe project.nsi

      - name: Stage installer
        shell: pwsh
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path build/dist | Out-Null
          Copy-Item build/bin/Heka-amd64-installer.exe "build/dist/heka-$env:VERSION-amd64-setup.exe" -Force

      - name: Upload to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: gh release upload "$env:TAG" "build/dist/heka-$env:VERSION-amd64-setup.exe" --clobber --repo "$env:GITHUB_REPOSITORY"

  macos:
    needs: resolve
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build universal app
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: wails build -clean -platform darwin/universal -ldflags "-X main.appVersion=$VERSION"

      - name: Ad-hoc sign
        run: |
          codesign --force --deep -s - build/bin/Heka.app
          codesign --verify --deep --strict build/bin/Heka.app

      - name: Build DMG
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: ./build/darwin/make_dmg.sh "$VERSION"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: gh release upload "$TAG" "build/bin/heka-$VERSION.dmg" --clobber --repo "$GITHUB_REPOSITORY"
